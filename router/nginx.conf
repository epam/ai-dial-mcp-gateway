# The front router: the one public origin a harness sees.
#
# It splits the public surface in three. The authorization surface — the discovery
# documents, the JWKS, and the OAuth endpoints a harness talks to during sign-in — belongs
# to the gateway. The toolset MCP data path goes straight to Core, because MCP traffic is
# Core's job and the gateway is deliberately not on that path. Everything else reaches
# Core unchanged, so Core's own API and its own toolset routes keep working for clients
# that never involve the gateway.
#
# The router synthesizes two answers of its own, and only these two. The first: a 401 on a
# data path — the toolset path or the apps path — is answered with the gateway's challenge
# instead of Core's. Core answers such a call with its own `WWW-Authenticate` — pointing at
# Core's protected-resource document, which describes an authorization server no harness
# can complete a sign-in against (the upstream's, for a toolset; for an app, a deployment
# fact of Core's toolsets.security configuration). A harness that followed it would fail
# and discard its token. The gateway's protected-resource document describes the
# authorization server that can complete the sign-in, so that is the challenge a client
# must see, and Core's must not — on either path shape.
#
# The second: the `/.well-known/` namespace is closed. A discovery path no location below
# serves is answered with a fixed JSON 404 and is never forwarded. Left to fall through to
# Core, such a path gets Core's authentication refusal, which a discovering client reads as
# "discovery itself needs a credential" and abandons the server. The only Core paths under
# `/.well-known/` that stay reachable are Core's own two protected-resource templates.
#
# Ordering is load-bearing. The regex locations are evaluated in the order they appear, so
# the authorization-surface locations come before the toolset data-path location that
# would otherwise match a toolset named after one of them. The gateway refuses to start
# with such a name mapped, and the order here is the second half of the same guard.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Container logs only. The access log carries request lines, and the authorization
    # surface's request lines include codes and tokens; the gateway keeps its own audit
    # trail, which names flows and subjects and never a credential.
    access_log off;
    error_log /dev/stderr warn;

    # Core is reached by its service name on the instance network.
    upstream core {
        server core:8080;
    }

    # The gateway is reached at sibling localhost, not by service name. The router and the
    # gateway share one network namespace — the pod shape — so the gateway's loopback is
    # this router's loopback, and the address the router dials is exactly the gateway's
    # own listener, not a name resolved on a wider network. This is the conf's half of the
    # pod's sibling-localhost assumption: the router is the authority for the forwarded
    # client address the gateway's per-source rate limit counts against, because a client
    # reaches the gateway only through this location. The gateway also joins the instance
    # network (Core fetches its JWKS there), so it remains name-routable inside that
    # network; the sibling-localhost upstream is about which address *this router* dials,
    # and the two facts are stated together in `docs/pod-contract.md`.
    upstream gateway {
        server 127.0.0.1:8091;
    }

    # The challenge the data path answers a 401 with, or nothing on any other status so
    # the header is absent everywhere it does not belong.
    #
    # `$tseg` is the named capture from the toolset data-path map below — the raw request
    # URI's path segment(s), in the client's own spelling. The map's named capture is
    # visible here (a map regex's captures become variables), so the header the challenge
    # carries names the exact path the client called, encoded characters included: the same
    # capture builds the Core target and the metadata path, so the two cannot disagree.
    map $status $mcp_challenge {
        default "";
        401     'Bearer resource_metadata="$mcp_origin/.well-known/oauth-protected-resource/dial/$tseg/mcp"';
    }

    # The apps data path's challenge, from a second map keyed on the same `$status`. A second
    # map rather than one parameterized map because the header value differs by capture
    # variable (`$tseg` against `$aseg`) and a map's value is a fixed template per variable
    # — and because the apps challenge must quote the app resource's own metadata path, so a
    # strict client's sign-in can complete. `$aseg` is the capture from the apps data-path
    # map, visible here for the same reason `$tseg` is.
    map $status $apps_mcp_challenge {
        default "";
        401     'Bearer resource_metadata="$mcp_origin/.well-known/oauth-protected-resource/apps/$aseg/mcp"';
    }

    # The toolset data path, from a map keyed on `$request_uri` — the raw, never-decoded
    # request URI. A decoded capture cannot faithfully carry percent-encoded names: nginx
    # matches locations against its normalized (decoded) URI and a variable `proxy_pass`
    # does not re-escape a captured value, so a decoded capture 400s a space, corrupts `?`,
    # `#`, and `%`, and merges `%2F` with a raw slash (all measured on this image). Keying
    # the map on the raw URI and forwarding the raw bytes makes forwarding **byte-faithful**:
    # the request Core receives is byte-identical to the one the client sent.
    #
    # The map's pattern is a grammar, not a wildcard. Each segment is unreserved characters
    # or percent-escapes (the unreserved class EXCLUDES `%`, so the `%XX` alternative is
    # unambiguous and no overlapping alternates exist — the ReDoS discipline; brace
    # quantifiers are avoided because nginx's parser rejects them here, so the doubled
    # character classes stand in for `{n}`). A segment ends in a non-dot atom, so a trailing
    # dot is refused; a whole-segment `.`/`..` and an empty segment cannot match. The pattern's
    # match domain is the WHOLE raw request URI, anchored at both ends with an optional
    # `?query` tail after `/mcp` and nothing after `/mcp` but that tail: a query-bearing
    # session-resume request (`…/mcp?sessionId=<id>`) matches, and a post-`/mcp` path tail
    # (`…/mcp/extra`) does not — so the capture cannot alias a longer path onto the data path.
    # On a match the map yields the Core target built from the raw captured bytes; on no match
    # it yields the empty string, and the location's `if ($dial_target = "") { return 404; }`
    # refuses the request without forwarding.
    map $request_uri $dial_target {
        default "";
        "~^/dial/(?<tseg>(?:[A-Za-z0-9_~.-]|%[0-9A-Fa-f][0-9A-Fa-f])*(?:[A-Za-z0-9_~-]|%[0-9A-Fa-f][0-9A-Fa-f])(?:/(?:[A-Za-z0-9_~.-]|%[0-9A-Fa-f][0-9A-Fa-f])*(?:[A-Za-z0-9_~-]|%[0-9A-Fa-f][0-9A-Fa-f]))*)/mcp(\?.*)?$" /v1/toolset/$tseg/mcp;
    }

    # The apps data path's target map, the toolset map's twin over the `/apps/` prefix and
    # Core's deployments path. The same grammar, the same byte-faithfulness, the same
    # match-domain discipline.
    map $request_uri $apps_target {
        default "";
        "~^/apps/(?<aseg>(?:[A-Za-z0-9_~.-]|%[0-9A-Fa-f][0-9A-Fa-f])*(?:[A-Za-z0-9_~-]|%[0-9A-Fa-f][0-9A-Fa-f])(?:/(?:[A-Za-z0-9_~.-]|%[0-9A-Fa-f][0-9A-Fa-f])*(?:[A-Za-z0-9_~-]|%[0-9A-Fa-f][0-9A-Fa-f]))*)/mcp(\?.*)?$" /v1/deployments/$aseg/mcp;
    }

    # The two raw-URI checks below exist because nginx selects a location on the normalized
    # URI (percent-decoded, dot segments resolved, slashes merged) but a `proxy_pass` with no
    # URI forwards the raw one, and Core matches its own routes on the raw path. A raw URI
    # can therefore select one location and deliver a different path upstream. Both maps are
    # keyed on `$request_uri` — the raw, never-decoded URI — like the data-path maps above,
    # and each is read only by the location that forwards to Core.

    # Core's two protected-resource templates, matched on the raw request URI as Core itself
    # matches them: the template path, then nothing but an optional query. `[^?]+` mirrors
    # Core's own non-greedy id over the path (Core's path excludes the query). On the raw URI
    # a `%0A` is three literal characters, so `$` cannot match early the way it can against
    # a decoded trailing line break. A spelling that normalizes onto the template from
    # outside it — dot segments before or across the `toolset` prefix, an encoded character
    # in `toolset` — does not match. Dot segments, `#` and `%23` inside the id do match, as
    # they do in Core's own raw template, so what is forwarded is exactly what Core's
    # unauthenticated metadata route answers.
    map $request_uri $core_prm_raw {
        default "";
        "~^/\.well-known/oauth-protected-resource/v1/(?:toolset|deployments)/[^?]+/mcp(?:\?.*)?$" 1;
    }

    # A raw path spelled in the `/.well-known` namespace: after any empty or `.` segments
    # (each separator spelled `/` or `%2F`, the dot possibly percent-encoded), a first segment
    # that is `.well-known` with any of its characters percent-encoded (the dot included),
    # ended by `/`, an encoded `/`, the query, or the end of the URI.
    # These are exactly the spellings nginx's normalization maps onto that segment, so a raw
    # path that would be refused as part of the namespace cannot slip into the catch-all by
    # normalizing out of it (`/.well-known/x/../../v1/y` normalizes to `/v1/y`). It is a
    # prefix test, not a substring test, so a legitimate Core path that merely contains the
    # string is not caught; a raw path whose first segment is something else is forwarded raw
    # by definition. Each prefix-loop iteration is an optional dot followed by a mandatory
    # separator, so a wrong guess backtracks at most one token and the match is linear; the
    # request-line bound below caps the input.
    map $request_uri $wk_raw_spelling {
        default "";
        "~^/(?:(?:\.|%2[Ee])?(?:/|%2[Ff]))*(?:\.|%2[Ee])(?:w|%77)(?:e|%65)(?:l|%6[Cc])(?:l|%6[Cc])(?:-|%2[Dd])(?:k|%6[Bb])(?:n|%6[Ee])(?:o|%6[Ff])(?:w|%77)(?:n|%6[Ee])(?:/|%2[Ff]|\?|$)" 1;
    }

    server {
        listen 8090;

        # The request-line length bound, stated rather than inherited, and the input bound
        # upstream of every regex above. `$request_uri`'s grammar is a nested-quantifier
        # regex over overlapping-looking classes; the pathological-URI probe row asserts a
        # fast refusal, and this bound is what caps how long an input it can be asked to scan.
        # 4 8k is nginx's own default, made explicit here so a reader sees the bound rather
        # than assuming it.
        large_client_header_buffers 4 8k;

        # The public-origin byte cap, stated rather than inherited. nginx otherwise
        # applies its own implicit 1 MB default, which is both unstated and larger than
        # any request this front door legitimately carries, so it would be the real bound
        # on the authorization surface while appearing in no configuration. The three
        # unauthenticated body-bearing endpoints — `/dial/register`, `/dial/token`,
        # `/dial/revoke` — each cap their own body while reading it; this is the
        # defense-in-depth bound in front of them, and it is deliberately larger than
        # their caps (16384 against 8192) so the two answer different layers. This cap
        # bounds what reaches the gateway at all: a body over it is refused here with 413
        # and never forwarded. A body under it that is over an endpoint's own cap does
        # reach the gateway, and the gateway refuses it while reading with that
        # endpoint's OAuth error shape at 400. Sizing this cap at or below the gateway's
        # would collapse the layers into one and give up the OAuth error contract for
        # every oversize form, since a 413 from nginx carries no OAuth shape.
        #
        # The MCP data path is deliberately not exempt: an MCP JSON-RPC call carries a
        # few kilobytes, and a bound every request shares has one value to reason about
        # rather than one per location.
        client_max_body_size 16384;

        # The origin every challenge quotes, and the reason it is a configured value
        # rather than `$host`: `$host` drops the port, so behind TLS on a non-default port
        # — or on plain http on 8090, as locally — a client that followed the challenge
        # would fetch metadata from a URL this router does not serve. The value must equal
        # the gateway's `GATEWAY_PUBLIC_ORIGIN`: the router publishes that origin, the
        # gateway mints its tokens with it as `iss`, and every discovery document is
        # spelled with it.
        set $mcp_origin "http://localhost:8090";

        # The composed stack's health probe: forwarded to the gateway so the router's
        # healthcheck measures the link it actually depends on, not just its own process.
        location = /healthz {
            proxy_pass http://gateway/healthz;
        }

        # -- The authorization surface: the gateway's own endpoints ------------------

        # The flat RFC 8414 metadata document. An exact location, because it is one
        # path and Core serves nothing there.
        location = /.well-known/oauth-authorization-server {
            proxy_pass http://gateway;
        }

        # The same document at every other location a discovering client may try for this
        # issuer: the OpenID Connect location, and the path-insertion form of both (a
        # client that reads a resource URL as an issuer URL inserts the well-known segment
        # before its path). The gateway answers all of them from the one document builder,
        # so the alias cannot differ from the canonical location. The exact location above
        # is checked first and is unaffected. The end anchor is `\z`, not `$`: PCRE's `$`
        # also matches before a final line break, so `$` would select this location for a
        # decoded `...openid-configuration%0A`, which is not an alias path.
        location ~ ^/\.well-known/(oauth-authorization-server|openid-configuration)(/|\z) {
            proxy_pass http://gateway;
        }

        # Each toolset's RFC 9728 protected-resource document, served from the resource's
        # own path so a client following a challenge lands on the document describing the
        # resource it was challenged for.
        location ~ ^/\.well-known/oauth-protected-resource/dial/ {
            proxy_pass http://gateway;
        }

        # Each app's RFC 9728 protected-resource document, the apps twin of the toolset
        # route. The `/apps/` prefix is disjoint from every `/dial/` alternation, so ordering
        # against the toolset regex is irrelevant; both precede the catch-all by nginx's
        # regex-first matching.
        location ~ ^/\.well-known/oauth-protected-resource/apps/ {
            proxy_pass http://gateway;
        }

        # Core's own two protected-resource templates, forwarded to Core. When Core's
        # `toolsets.security.resourceHost` is unset it builds its MCP-path challenge from the
        # request authority, so a client that reached Core's own MCP path through the
        # catch-all below is pointed back at this host for these documents, and the closed
        # namespace must not take them. The location is end-anchored at `/mcp` because
        # those two templates are all Core serves under `/.well-known/`; any other shape
        # under that prefix gets the closure's 404. The regex only nominates a request on
        # the normalized path; `$core_prm_raw` decides on the raw URI that is actually
        # forwarded, and a request that is not literally one of Core's templates is handed
        # to the closure by an internal redirect. No streaming directives: Core answers one
        # JSON document. A Core release that adds a `/.well-known/` route re-opens this
        # location.
        location ~ ^/\.well-known/oauth-protected-resource/v1/(toolset|deployments)/.+/mcp$ {
            if ($core_prm_raw = "") {
                rewrite ^ /.well-known/ last;
            }
            proxy_pass http://core;
        }

        # The closed namespace. Every `/.well-known/` path no location above serves is
        # answered here and never forwarded, for every method: `return` runs before any
        # handler, so a POST body is never read and an OPTIONS preflight gets no CORS
        # header. These are plain prefix locations, which nginx uses only when no regex
        # location matches, so no regex above can be shadowed and the order of the regexes
        # cannot move the closure in front of a served location. Never write this as
        # `^~`: that skips regex matching entirely and would answer 404 for every
        # discovery document above.
        #
        # The body is a fixed literal, so no part of the request can appear in it. It is the
        # gateway's own unrouted-404 shape, so a client sees one 404 body under this
        # namespace whichever side refuses. `X-Content-Type-Options` is the one header the
        # gateway's JSON answers never carry, so the router's 404 can be told from the
        # gateway's; it is `always` because nginx otherwise attaches `add_header` to 2xx and
        # 3xx answers only, which would leave it off the 404 it exists to mark. The raw-URI
        # checks in the Core location and the catch-all hand a refused request to this
        # location by internal redirect, so this answer is defined here once.
        location = /.well-known {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            return 404 '{"detail":"Not Found"}';
        }

        location /.well-known/ {
            default_type application/json;
            add_header X-Content-Type-Options nosniff always;
            return 404 '{"detail":"Not Found"}';
        }

        # The OAuth endpoints the gateway owns, plus the JWKS Core verifies minted tokens
        # against, the two flow callbacks, and the consent action the decision page posts
        # to. The alternation is the same set the gateway's startup guard reserves: a
        # toolset named for one of these could never have its MCP traffic routed, because
        # this location matches first. Adding `consent` here is one lockstep with the
        # routing probe battery — a checkpoint whose action route is unrouted is a flow
        # that dead-ends at the decision page, so a half-routed deployment fails the probe
        # rather than a user.
        location ~ ^/dial/(callback|consent|jwks\.json|authorize|token|register|revoke)(/|$) {
            proxy_pass http://gateway;
        }

        # -- The MCP data path: Core, direct -----------------------------------------

        # The toolset data path. A prefix location, because the raw-URI map above — not the
        # location regex — is what decides routability: the map carries the segment grammar
        # and the `/mcp`-suffix match domain over the raw request URI, and yields the Core
        # target. `$dial_target` is empty for any request the grammar does not match, and the
        # documented-safe `if ($x = "") { return ...; }` form refuses it 404 without
        # forwarding. The location sits after the authorization-surface locations above, so
        # their names are still captured first — the second half of the reserved-name guard.
        location ~ ^/dial/ {
            if ($dial_target = "") {
                return 404;
            }
            # Variables in `proxy_pass` make nginx drop its own query-string append, so
            # `$is_args$args` is required rather than cosmetic: a streamable-HTTP session
            # resumes with `?sessionId=<id>`, and without this the parameter would never
            # reach Core. The target carries the raw captured bytes, so forwarding is
            # byte-faithful.
            proxy_pass http://core$dial_target$is_args$args;

            # Streamable HTTP answers are long-lived streams; buffering them would hold
            # them until the upstream closes them.
            proxy_buffering off;
            proxy_request_buffering off;

            # Drop Core's `WWW-Authenticate` and answer with the gateway's own challenge
            # (`$mcp_challenge`, above). Both halves are required and neither alone is
            # enough: without the hide, Core's challenge reaches the client beside the
            # gateway's, and a client that reads the first — or the list — sees one it
            # cannot complete; without the synthesized header, the 401 carries no
            # challenge at all and a client cannot tell where to authenticate.
            #
            # This is deliberately not `proxy_intercept_errors` with
            # `error_page 401 = @location`: measured on this image, an intercepted 401
            # re-serves the upstream response's headers, so Core's challenge survives into
            # the rewritten response and `proxy_hide_header` has no effect on it. The
            # mechanism there cannot satisfy the property, and the property is what
            # matters — every 401 on this path carries the gateway's challenge and nothing
            # of the upstream's.
            proxy_hide_header WWW-Authenticate;
            add_header WWW-Authenticate $mcp_challenge always;
        }

        # The apps MCP path, proxied to Core's deployments MCP path. Every element is the
        # toolset location's, carried over with the path re-derived and the map re-keyed on
        # the `/apps/` prefix: the kind lives in the path, so a toolset and an app that share
        # a name never collide. The `/apps` prefix is disjoint from every `/dial` alternation.
        location ~ ^/apps/ {
            if ($apps_target = "") {
                return 404;
            }
            # The same measured query-loss behavior as the toolset location: variables in
            # `proxy_pass` suppress nginx's query-string append, so `$is_args$args` keeps a
            # streamable session's `?sessionId=<id>` reaching Core.
            proxy_pass http://core$apps_target$is_args$args;

            # Streamable HTTP answers are long-lived streams on this path too.
            proxy_buffering off;
            proxy_request_buffering off;

            # Drop Core's challenge and answer with the apps one (`$apps_mcp_challenge`,
            # above), for the same reason and with the same required-both-halves discipline
            # as the toolset location.
            proxy_hide_header WWW-Authenticate;
            add_header WWW-Authenticate $apps_mcp_challenge always;
        }

        # -- Everything else: Core, unchanged ----------------------------------------
        #
        # The one thing the catch-all refuses: a raw path spelled in the `/.well-known`
        # namespace. nginx selects this location on the normalized path, so a raw spelling
        # such as `/.well-known/x/../../v1/y` normalizes out of the namespace and lands
        # here, while the raw URI it would forward still names `/.well-known/...`. The
        # check hands such a request to the closure instead, so the namespace's answer does
        # not depend on how the path is spelled and Core is never asked about a
        # `/.well-known/` URL it does not serve.

        location / {
            if ($wk_raw_spelling != "") {
                rewrite ^ /.well-known/ last;
            }
            proxy_pass http://core;

            # Streamable responses on Core's own paths are streams too.
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Shared by every location above. Core's server supports HTTP/1.1 only and answers
        # HTTP/1.0 requests with 505, and the gateway reads the forwarded client address
        # to bound its public endpoints per source — so both are stated once here rather
        # than repeated per location, where one omission would be a silent difference
        # between routes.
        #
        # `X-Real-IP` is this router's own statement about the peer it accepted the
        # connection from, which is what makes it trustworthy: a client cannot set it,
        # because a client's traffic reaches the gateway only through this router. That
        # property depends on the gateway's container port (8091) never being published
        # to a host — a request delivered to 8091 directly never crossed this location and
        # carries whatever headers its sender chose. `docker-compose.yml` states the same
        # invariant at the gateway service; the two are halves of one control, and dropping
        # either one leaves the per-source rate limit a bound the caller sets.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
